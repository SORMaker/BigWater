name: Tests

# macOS runner minutes cost more on private repositories, so this runs on
# pull requests and on demand rather than on every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app as it ships
        run: swift build -c release --product BigWater
      - name: Run the tests
        run: swift run BigWaterTests
