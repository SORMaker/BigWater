name: Checks

# macOS runner minutes are billed at a higher rate for private repositories,
# so this runs on pull requests and on demand rather than on every push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: swift build -c release --product BigWater
      - name: Core checks
        run: swift run BigWaterChecks
      # The session checks open real overlay windows and need an awake
      # desktop session, so they run locally with Tools/check-session.sh.
